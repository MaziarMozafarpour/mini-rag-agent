[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_rag"]
